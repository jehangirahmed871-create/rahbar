name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.8 mypy==1.15.0

      - name: Run Ruff Linter
        run: |
          ruff check api indexer eval corpus

  test:
    name: Unit & Offline Stub Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          export PYTHONPATH="api:indexer"
          pytest -v api/tests indexer/tests

  manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubeconform & Kustomize
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Manifests with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  build:
    name: Build Docker Images (No Push on PR)
    needs: [lint, test, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: false
          tags: rahbar-api:${{ github.sha }}

      - name: Build Indexer Image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: false
          tags: rahbar-indexer:${{ github.sha }}

      - name: Build UI Image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: false
          tags: rahbar-ui:${{ github.sha }}

  scan:
    name: Vulnerability Scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build local image for scanning
        run: |
          docker build -t rahbar-api:${{ github.sha }} api

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-api:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  e2e-eval:
    name: End-to-End Evaluation Gate
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Client and Eval Dependencies
        run: |
          pip install httpx pyyaml pydantic

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar-ci
          version: v0.23.0

      - name: Build and Load Images into Kind
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui
          kind load docker-image rahbar-api:dev --name rahbar-ci
          kind load docker-image rahbar-indexer:dev --name rahbar-ci
          kind load docker-image rahbar-ui:dev --name rahbar-ci

      - name: Setup Namespace and Fixtures
        run: |
          kubectl create namespace rahbar --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="test-ci-key" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap rahbar-fixtures -n rahbar \
            --from-file=eval/fixtures/academic-rules-2023.md \
            --from-file=eval/fixtures/academic-rules-2026.md \
            --from-file=eval/fixtures/fees-2026.md \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl patch configmap rahbar-config -n rahbar --type merge -p '{"data":{"LLM_PROVIDER":"stub","RETRIEVER":"chroma"}}'
          # Scale down API and temporarily remove HPA to avoid resource contention on Kind node during indexing
          kubectl scale deployment/api -n rahbar --replicas=0
          kubectl delete hpa api-hpa -n rahbar --ignore-not-found

      - name: Wait for Stateful Backends
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=120s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s

      - name: Run Indexer Job on Fixtures
        run: |
          kubectl apply -f k8s/base/indexer-job.yaml
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s || {
            echo "=== Indexer Job Describe ==="
            kubectl describe job indexer -n rahbar
            echo "=== Pods in rahbar namespace ==="
            kubectl get pods -n rahbar
            echo "=== Indexer Pod Logs ==="
            kubectl logs -n rahbar -l app.kubernetes.io/name=indexer --tail=100
            echo "=== Chroma Pod Logs ==="
            kubectl logs -n rahbar -l app.kubernetes.io/name=chroma --tail=50
            exit 1
          }
          kubectl logs -n rahbar -l app.kubernetes.io/name=indexer

      - name: Wait for API Rollout Status
        run: |
          kubectl scale deployment/api -n rahbar --replicas=3
          kubectl apply -f k8s/base/hpa.yaml
          kubectl rollout status deployment/api -n rahbar --timeout=180s

      - name: Port-Forward API for Evaluation
        run: |
          kubectl port-forward svc/api -n rahbar 8000:8000 &
          for i in {1..20}; do
            if curl -s http://localhost:8000/healthz; then
              echo "API is answering health checks"
              break
            fi
            sleep 2
          done

      - name: Execute Evaluation Gate with eval/run_eval.py
        run: |
          python eval/run_eval.py --api http://localhost:8000 --golden eval/fixtures/golden.fixture.yaml --baseline eval/fixtures/baseline.fixture.json
