name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Offline Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Pytest
        run: |
          export PYTHONPATH="api:indexer"
          pytest -v api/tests indexer/tests

  build-push:
    name: Build & Push Images to Docker Hub
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and Push Indexer Image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy to Ephemeral Cluster and Smoke Test
    needs: [build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar-prod-ephemeral
          version: v0.23.0

      - name: Deploy Prod Overlay with SHA Image Tags
        run: |
          cd k8s/overlays/prod
          kustomize edit set image rahbar-api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          kustomize edit set image rahbar-indexer=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          kustomize edit set image rahbar-ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          cd ../../..
          kubectl apply -k k8s/overlays/prod

      - name: Run Indexer Job
        run: |
          kubectl apply -f k8s/base/indexer-job.yaml
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s || true

      - name: Verify API Deployment Rollout Status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s

      - name: Verify UI Deployment Rollout Status
        run: |
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Smoke Test Endpoint via Ingress/Port-Forward
        run: |
          kubectl port-forward svc/api -n rahbar 8000:8000 &
          sleep 5
          curl -f -s http://localhost:8000/healthz | grep "alive"
          echo "Smoke test passed successfully."
