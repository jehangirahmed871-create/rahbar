apiVersion: batch/v1
kind: Job
metadata:
  name: trace-summary
  namespace: rahbar
  labels:
    app.kubernetes.io/name: trace-summary
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-summary
    spec:
      restartPolicy: Never
      serviceAccountName: eval-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: summarize
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/eval/summarise_traces.py
          args:
            - --traces
            - /traces/queries.jsonl
            - --since-minutes
            - "1440"
            - --out
            - /results/trace-summary.json
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: traces
              mountPath: /traces
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: traces
          persistentVolumeClaim:
            claimName: traces-pvc
        - name: results
          persistentVolumeClaim:
            claimName: eval-results-pvc
        - name: tmp-dir
          emptyDir: {}
