apiVersion: batch/v1
kind: Job
metadata:
  name: release-gate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: evaluation
    app.kubernetes.io/instance: gate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation
        app.kubernetes.io/instance: gate
    spec:
      restartPolicy: Never
      serviceAccountName: eval-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gate
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/eval/release_gate.py
          args:
            - --baseline
            - /results/part-e3-after-batch-b.json
            - --candidate
            - /results/part-c-candidate.json
            - --thresholds
            - /thresholds/release-thresholds.json
            - --out
            - /results/threshold-change-gate.json
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: results
              mountPath: /results
            - name: thresholds
              mountPath: /thresholds
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: eval-results-pvc
        - name: thresholds
          configMap:
            name: eval-thresholds
        - name: tmp-dir
          emptyDir: {}
