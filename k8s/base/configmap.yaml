apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
data:
  RETRIEVER: "chroma"
  EMBED_MODEL: "offline-feature-hash-v1"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  TOP_K: "5"
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.50"
  CACHE_THRESHOLD: "0.90"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  LLM_PROVIDER: "hosted"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "openai/gpt-oss-20b"
  LOG_LEVEL: "INFO"
  TRACE_DIR: "/traces"
