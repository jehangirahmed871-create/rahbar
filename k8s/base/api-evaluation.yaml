apiVersion: v1
kind: Service
metadata:
  name: api-baseline
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api-evaluation
    app.kubernetes.io/instance: api-baseline
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: api-baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-baseline
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api-evaluation
    app.kubernetes.io/instance: api-baseline
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: api-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-evaluation
        app.kubernetes.io/instance: api-baseline
    spec:
      enableServiceLinks: false
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_PROVIDER
              value: hosted
            - name: HOSTED_BASE_URL
              value: https://api.groq.com/openai/v1
            - name: LLM_MODEL
              value: openai/gpt-oss-20b
            - name: CHROMA_COLLECTION
              value: rahbar
            - name: TOP_K
              value: "5"
            - name: CACHE_THRESHOLD
              value: "1.01"
            - name: TRACE_DIR
              value: /traces
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: traces
              mountPath: /traces
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: traces
          persistentVolumeClaim:
            claimName: traces-pvc
---
