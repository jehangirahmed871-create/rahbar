apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: CORPUS_DIR
              value: "/corpus"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: corpus-data
              mountPath: /corpus
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: corpus-data
          configMap:
            name: rahbar-fixtures
            optional: true
        - name: tmp-dir
          emptyDir: {}
