apiVersion: batch/v1
kind: Job
metadata:
  name: batch-b-seed
  namespace: rahbar
  labels:
    app.kubernetes.io/name: corpus-seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corpus-seed
    spec:
      restartPolicy: Never
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: batch-b-seed
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /corpus-pvc/.batch-b-seeded ]; then
                mkdir -p /corpus-pvc/batch-b
                cp -a /batch-b/. /corpus-pvc/batch-b/
                touch /corpus-pvc/.batch-b-seeded
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: corpus-data
              mountPath: /corpus-pvc
      volumes:
        - name: corpus-data
          persistentVolumeClaim:
            claimName: corpus-pvc
